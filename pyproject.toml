[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-chunking-agent"
version = "0.1.0"
description = "PDF chunking for retrieval: the study code (parsers, chunkers, frozen scorer_v1) and the agent built on it"
readme = "README.md"
requires-python = ">=3.14"
# Versions from docs/environment.md (the laptop pins in requirements.txt).
# Packages the code imports that docs/environment.md does not list are pinned to requirements.txt.
dependencies = [
    "pdfplumber==0.11.10",
    "torch==2.15.0",
    "sentence-transformers==6.2.0",
    "transformers==5.22.1",
    "tokenizers==0.23.3",
    "langchain-text-splitters==1.1.3",
    "langchain-experimental==0.4.2",
    "stanza==1.15.0",
    "llama_cloud==2.19.0",
    "pandas==3.1.0",
    "numpy==2.5.4",
    "huggingface_hub==2.3.0",
    "google-genai==2.34.0",
    "pypdf==6.21.2",
    "pyarrow==26.0.0",
    "RapidFuzz==3.14.6",
    "psutil==7.2.2",
    "img2pdf==0.6.3",
    "lxml==6.1.3",
    "pikepdf==10.18.0",
]

[project.optional-dependencies]
# Docling runs on Kaggle only (not installed in the laptop venv); version as in docs/environment.md.
docling = ["docling==2.143.0"]
test = ["pytest==9.1.1", "jsonschema==4.26.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*", "scripts", "scripts.*"]
